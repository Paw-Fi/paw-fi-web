# Dev environment configuration
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # Production Supabase configuration
  # Using secrets for secure environment variables
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=4096"

  # Development Supabase configuration
  # Using secrets for secure environment variables
  - variable: VITE_SUPABASE_URL
    secret: supabaseUrlSecret  # Reference to a secret in Cloud Secret Manager
    availability:
      - BUILD
      - RUNTIME
    
  - variable: VITE_SUPABASE_ANON_KEY
    secret: supabaseAnonKeySecret  # Reference to a secret in Cloud Secret Manager
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_STRIPE_PUBLISHABLE_KEY
    secret: stripePK_DEV  # Reference to a secret in Cloud Secret Manager
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_STRIPE_SECRET_KEY
    secret: stripeSK_DEV  # Reference to a secret in Cloud Secret Manager
    availability:
      - BUILD
      - RUNTIME
      
runtime: nodejs20  # or nodejs20
# Note: Need to grant access to the secrets to the app engine service account by using:
# firebase apphosting:secrets:grantaccess stripeSK_PROD --backend prod-paw-fi-web

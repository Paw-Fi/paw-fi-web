# Dev environment configuration
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # Staging Supabase configuration
  - variable: VITE_SUPABASE_URL
    value: ${VITE_SUPABASE_URL}
    availability:
      - BUILD
      - RUNTIME
  
  - variable: VITE_SUPABASE_ANON_KEY
    value: ${VITE_SUPABASE_ANON_KEY}
    availability:
      - BUILD
      - RUNTIME

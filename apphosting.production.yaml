# Production configuration for TanStack Start node-server application
# Remove static handlers - Firebase App Hosting will run the Node.js server directly

runConfig:
  minInstances: 0        # Scale to zero during off-peak to minimize costs  
  maxInstances: 3        # Sufficient for 10-50 daily users
  concurrency: 80        # Adequate for small user base
  cpu: 1                 # 1 CPU for F2-equivalent performance
  memoryMiB: 512         # 512MB memory for TanStack Start

# Override build and run commands for TanStack Start
scripts:
  buildCommand: npm run build
  runCommand: node .output/server/index.mjs

env:
  # Optimized Node.js settings for F2 instances and build process
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=4096"  # Increased memory allocation for complex SSR build with prerendering

  - variable: VITE_SUPABASE_URL
    secret: supabaseUrlSecretProd
    availability:
      - BUILD
      - RUNTIME
    
  - variable: VITE_SUPABASE_ANON_KEY
    secret: supabaseAnonKeySecretProd
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_STRIPE_PUBLISHABLE_KEY
    secret: stripePK_PROD
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_STRIPE_SECRET_KEY
    secret: stripeSK_PROD
    availability:
      - BUILD
      - RUNTIME

# Performance and reliability settings
inbound_services:
  - warmup  # Keeps instances warm to reduce cold starts

# Optimized timeout for Node.js server requests
timeout: 30s  # Sufficient for server-side rendered content

# Health checks for better reliability
readiness_check:
  path: "/"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

# Security and performance headers
network:
  forwarded_ports:
    - 443
  session_affinity: false  # Not needed for TanStack Start server

# Note: Grant access to secrets using:
# firebase apphosting:secrets:grantaccess stripeSK_PROD --backend prod-paw-fi-web
# firebase apphosting:secrets:grantaccess supabaseUrlSecretProd --backend prod-paw-fi-web
# firebase apphosting:secrets:grantaccess supabaseAnonKeySecretProd --backend prod-paw-fi-web
# firebase apphosting:secrets:grantaccess stripePK_PROD --backend prod-paw-fi-web

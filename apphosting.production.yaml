# Firebase App Hosting configuration for TanStack Start Node.js server
# This configures a Node.js server application, not static file hosting

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # Production Supabase configuration
  # Using secrets for secure environment variables
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=4096"
    
  # Application secrets
  - variable: VITE_SUPABASE_URL
    secret: supabaseUrlSecretProd
    availability:
      - BUILD
      - RUNTIME    
  - variable: VITE_SUPABASE_ANON_KEY
    secret: supabaseAnonKeySecretProd
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_STRIPE_PUBLISHABLE_KEY
    secret: stripePK_PROD
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_STRIPE_SECRET_KEY
    secret: stripeSK_PROD
    availability:
      - BUILD
      - RUNTIME

runtime: nodejs20

# Build configuration with cleanup steps to resolve dependency conflicts
buildConfig:
  # Override default npm ci behavior to use npm install instead
  install:
    - name: "Clean up existing files"
      run: |
        echo "Cleaning up package-lock.json and node_modules..."
        rm -f package-lock.json
        rm -rf node_modules
        echo "Cleanup complete"
    - name: "Install dependencies with npm install"
      run: "npm install"
  build:
    - name: "Build application"
      run: "npm run build"

# Health check configuration using your /health route
healthCheck:
  path: "/health"
  checkIntervalSec: 30
  timeoutSec: 10
  failureThreshold: 3
  successThreshold: 1
  initialDelaySec: 60

# Note: Secrets access granted on 2025-09-20:

# Firebase App Hosting configuration for TanStack Start Node.js server
# This configures a Node.js server application, not static file hosting

runConfig:
  minInstances: 1
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 2048

env:
  # Production Supabase configuration
  # Using secrets for secure environment variables
  # Increased heap size for Vite SSR build which requires significant memory
  # Build environment has more memory available than runtime
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=4096"
    availability:
      - BUILD
      - RUNTIME  
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
    
  # Application secrets
  - variable: VITE_SUPABASE_URL
    secret: supabaseUrlSecretProd
    availability:
      - BUILD
      - RUNTIME    
  - variable: VITE_SUPABASE_ANON_KEY
    secret: supabaseAnonKeySecretProd
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_STRIPE_PUBLISHABLE_KEY
    secret: stripePK_PROD
    availability:
      - BUILD
      - RUNTIME

  # IMPORTANT: Do not expose Stripe secret to the build/client. Use non-VITE prefix and RUNTIME only
  - variable: STRIPE_SECRET_KEY
    secret: stripeSK_PROD
    availability:
      - RUNTIME

# Override App Hosting framework detection to use our custom scripts
# This opts out of TanStack Start framework adapter to use our custom Nitro build
scripts:
  # Explicitly set NODE_OPTIONS in buildCommand to ensure it's applied
  buildCommand: NODE_OPTIONS="--max-old-space-size=4096" npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include: [.]

runtime: nodejs22

# Note: Secrets access granted on 2025-09-20:
# ✔ firebase apphosting:secrets:grantaccess stripeSK_PROD --backend prod-paw-fi-web
# ✔ firebase apphosting:secrets:grantaccess supabaseUrlSecretProd --backend prod-paw-fi-web  
# ✔ firebase apphosting:secrets:grantaccess supabaseAnonKeySecretProd --backend prod-paw-fi-web
# ✔ firebase apphosting:secrets:grantaccess stripePK_PROD --backend prod-paw-fi-web
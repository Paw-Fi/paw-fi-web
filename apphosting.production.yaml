# Optimized production configuration for small project
runtime: nodejs20

# F1 is sufficient for small production projects (saves ~60% costs vs F2)
instance_class: F1  # 600MHz CPU, 128MB RAM - perfect for static sites with Cloudflare
service: default

automatic_scaling:
  min_instances: 1        # Start with 1 instance to save costs
  max_instances: 5        # Reduced max for small project
  target_cpu_utilization: 0.70  # Slightly higher threshold
  target_throughput_utilization: 0.80
  max_concurrent_requests: 80   # F1 can handle more concurrent requests for static content

# F1 instances have fixed resources, no need to specify
# resources section not needed for F1

handlers:
  # Static assets with aggressive caching
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif))
    static_files: build/\1
    upload: build/(.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif))
    secure: always
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"
      Vary: "Accept-Encoding"
    expiration: "365d"

  # HTML files with shorter cache
  - url: /(.*\.html)$
    static_files: build/\1
    upload: build/(.*\.html)$
    secure: always
    http_headers:
      Cache-Control: "public, max-age=3600, must-revalidate"
      Vary: "Accept-Encoding"
    expiration: "1h"

  # Root and other routes
  - url: /(.*)
    static_files: build/index.html
    upload: build/index.html
    secure: always
    redirect_http_response_code: 301
    http_headers:
      Cache-Control: "public, max-age=3600, must-revalidate"
      Vary: "Accept-Encoding"
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"

env:
  # Optimized Node.js settings for F1 instances
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=512"  # Reduced for F1 instance (128MB RAM)

  - variable: VITE_SUPABASE_URL
    secret: supabaseUrlSecretProd
    availability:
      - BUILD
      - RUNTIME
    
  - variable: VITE_SUPABASE_ANON_KEY
    secret: supabaseAnonKeySecretProd
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_STRIPE_PUBLISHABLE_KEY
    secret: stripePK_PROD
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_STRIPE_SECRET_KEY
    secret: stripeSK_PROD
    availability:
      - BUILD
      - RUNTIME

# Performance and reliability settings
inbound_services:
  - warmup  # Keeps instances warm to reduce cold starts

# Optimized timeout for static content (was 300s - way too high!)
timeout: 30s  # Sufficient for static files, forces optimization

# Health checks for better reliability
readiness_check:
  path: "/"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

# Security and performance headers
network:
  forwarded_ports:
    - 443
  session_affinity: false  # Not needed for static content

# Note: Grant access to secrets using:
# firebase apphosting:secrets:grantaccess stripeSK_PROD --backend prod-paw-fi-web
# firebase apphosting:secrets:grantaccess supabaseUrlSecretProd --backend prod-paw-fi-web
# firebase apphosting:secrets:grantaccess supabaseAnonKeySecretProd --backend prod-paw-fi-web
# firebase apphosting:secrets:grantaccess stripePK_PROD --backend prod-paw-fi-web
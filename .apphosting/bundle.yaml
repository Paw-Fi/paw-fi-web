version: v1
runConfig:
  runCommand: npm run start
  environmentVariables:
    - variable: NODE_ENV
      value: production
      availability: RUNTIME
    - variable: HOST
      value: 0.0.0.0
      availability: RUNTIME
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 3

outputFiles:
  serverApp:
    include:
      - .output
      - scripts
      - package.json
      - package-lock.json

metadata:
  adapterPackageName: custom-tanstack-start
  adapterVersion: 1.0.0
  framework: tanstack-start
  frameworkVersion: 1.132.7
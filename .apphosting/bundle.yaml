version: v1
runConfig:
  runCommand: node scripts/start-server.js
  environmentVariables:
    - variable: NODE_ENV
      value: production
      availability: RUNTIME
    - variable: HOST
      value: 0.0.0.0
      availability: RUNTIME
  concurrency: 100
  cpu: 2
  memoryMiB: 1024
  minInstances: 2
  maxInstances: 10

outputFiles:
  serverApp:
    include:
      - .output
      - scripts
      - package.json
      - package-lock.json

metadata:
  adapterPackageName: custom-tanstack-start
  adapterVersion: 1.0.0
  framework: tanstack-start
  frameworkVersion: 1.132.7
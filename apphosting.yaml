# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Configure environment variables for Supabase
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  - variable: VITE_SUPABASE_URL
    secret: supabaseUrlSecret  # Reference to a secret in Cloud Secret Manager
    availability:
      - BUILD
      - RUNTIME
  
  - variable: VITE_SUPABASE_ANON_KEY
    secret: supabaseAnonKeySecret  # Reference to a secret in Cloud Secret Manager
    availability:
      - BUILD
      - RUNTIME
  
  # Alternative approach if you don't want to use secrets:
  # - variable: VITE_SUPABASE_URL
  #   value: "https://qbuynyxyemigtnvdujts.supabase.co"  # Direct value, not variable substitution
  #   availability:
  #     - BUILD
  #     - RUNTIME

# Custom build and start commands
customBuildCommand: npm run build
entryPoint: node .output/server/index.mjs

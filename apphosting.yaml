# Firebase App Hosting configuration using modern scripts format
runtime: nodejs22

env:
  - variable: NPM_CONFIG_REGISTRY
    value: https://registry.npmjs.org/
    availability:
      - BUILD
  - variable: NPM_CONFIG_ALWAYS_AUTH
    value: "false"
    availability:
      - BUILD
  - variable: NPM_CONFIG_USERCONFIG
    value: "/workspace/.npmrc"
    availability:
      - BUILD

scripts:
  # Let the buildpack install dependencies using npm ci with the existing lockfile
  buildCommand: npm run build
  runCommand: npm run start

outputFiles:
  serverApp:
    include: [.output]